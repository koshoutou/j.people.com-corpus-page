<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, minimum-scale=1.0">
    <meta name="description" content="人民网中日对译语料库 - 从人民网日文版'中国語教室'栏目采集的中日对照翻译语料">
    <meta name="keywords" content="中日翻译,语料库,人民网,翻译研究,语言学习">
    <meta name="author" content="koshoutou">
    <meta name="theme-color" content="#1a1a1a" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#111111" media="(prefers-color-scheme: dark)">
    <title>人民网中日对译语料库</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%231a1a1a'/%3E%3Ctext x='50' y='68' font-size='52' text-anchor='middle' fill='white' font-family='sans-serif'%3E語%3C/text%3E%3C/svg%3E">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="中日语料库">
    <meta name="mobile-web-app-capable" content="yes">
</head>
<body>
    <header>
        <div class="container">
            <h1>人民网中日对译语料库</h1>
            <div class="header-actions">
                <button class="theme-toggle" id="theme-toggle" title="切换主题" aria-label="切换主题">
                    <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                    <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
                </button>
                <a href="https://github.com/koshoutou/j.people.com-corpus-page" target="_blank" rel="noopener" title="GitHub 仓库" aria-label="GitHub 仓库">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/></svg>
                </a>
            </div>
        </div>
    </header>

    <main>
        <div class="container">
            <div class="search-box">
                <div class="search-input-wrapper">
                    <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                    <input type="text" id="search-input" placeholder="输入中文、日文或标题搜索...">
                </div>
                <button id="search-button">搜索</button>
            </div>

            <div class="stats">
                <div class="stat-item">
                    <div class="number" id="total-sentences">0</div>
                    <div class="label">总语句数</div>
                </div>
                <div class="stat-item">
                    <div class="number" id="unique-sources">0</div>
                    <div class="label">来源文章</div>
                </div>
                <div class="stat-item">
                    <div class="number" id="unique-titles">0</div>
                    <div class="label">不同标题</div>
                </div>
            </div>

            <div class="sentence-list">
                <div id="sentence-list">
                    <div class="loading">
                        <div class="loading-spinner"></div>
                        <p>正在加载数据...</p>
                    </div>
                </div>
            </div>

            <div class="pagination">
                <button id="prev-page" disabled>‹ 上一页</button>
                <span id="page-info">第 <span id="current-page-num">1</span> 页 / 共 <span id="total-pages-num">1</span> 页</span>
                <button id="next-page" disabled>下一页 ›</button>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-info">
                    <p class="copyright">&copy; 2025-2026 人民网中日对译语料库项目 | 作者: koshoutou (koshoutou@foxmail.com)</p>
                    <p class="data-source">数据来源: <a href="https://j.people.com.cn/" target="_blank" rel="noopener">人民网日文版</a> 中国语教室栏目公开新闻内容 (2018.3.1-now)</p>
                </div>
                <div class="footer-links">
                    <a href="https://github.com/koshoutou/j.people.com-corpus-page" target="_blank" rel="noopener">GitHub</a>
                    <span class="separator">|</span>
                    <a href="https://j.people.com.cn/" target="_blank" rel="noopener">人民网日文版</a>
                </div>
            </div>
            <div class="footer-bottom">
                <p>使用本项目内容时请遵守相关法律法规，禁止商用，请勿用于违反人民网著作权声明的用途。如涉及版权问题请联系作者。</p>
            </div>
        </div>
    </footer>

    <script src="js/main.js"></script>
    <script>
    (function() {
        var toggle = document.getElementById('theme-toggle');
        var moon = toggle.querySelector('.icon-moon');
        var sun = toggle.querySelector('.icon-sun');
        var root = document.documentElement;

        function getTheme() {
            return localStorage.getItem('theme') ||
                (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        }

        function setTheme(theme) {
            root.setAttribute('data-theme', theme);
            localStorage.setItem('theme', theme);
            moon.style.display = theme === 'dark' ? 'none' : '';
            sun.style.display = theme === 'dark' ? '' : 'none';
        }

        setTheme(getTheme());

        toggle.addEventListener('click', function() {
            var current = root.getAttribute('data-theme');
            setTheme(current === 'dark' ? 'light' : 'dark');
        });

        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(e) {
            if (!localStorage.getItem('theme')) {
                setTheme(e.matches ? 'dark' : 'light');
            }
        });
    })();
    </script>
</body>
</html>
